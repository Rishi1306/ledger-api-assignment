name: build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          # Hardcoded lowercase — GHCR requires all-lowercase repository names
          IMAGE=ghcr.io/rishi1306/ledger-api:sha-$(git rev-parse --short HEAD)
          docker build -t "$IMAGE" ./app
          docker push "$IMAGE"
