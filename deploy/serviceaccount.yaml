apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger-api
  namespace: payments
# Don't auto-mount a K8s API token — the app doesn't call the K8s API.
automountServiceAccountToken: false
---
# Role: only what ledger-api actually needs (read its own ConfigMap).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ledger-api-role
  namespace: payments
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["ledger-api-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ledger-api-rolebinding
  namespace: payments
subjects:
  - kind: ServiceAccount
    name: ledger-api
    namespace: payments
roleRef:
  kind: Role
  name: ledger-api-role
  apiGroup: rbac.authorization.k8s.io
